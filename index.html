<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite De Casamento</title>
    <link rel="shortcut icon" href="./bride.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">


        <div class="top-title">
            Com Muita Alegria Convidamos Você Para<br>
            Celebrar Nosso Casamento!
        </div>

        <h1 class="nomes">Fernando & Viviane</h1>

        <div class="linha-data">
            <div class="lado">SÁBADO</div>

            <div class="centro-data">
                <h1 class="dia">05 / Dez / 2026</h1>
            </div>

            <div class="lado">ÀS 19Hrs</div>
        </div>

        <div id="contador" class="contador"></div>

        <div class="casal">
            <img src="casal.png">
        </div>



        <div class="endereco_container">

            <div class="botao" onclick="window.open('https://maps.app.goo.gl/zqUxPTDcG8fg9rB19')">Ver Mapa</div>

            <div class="endereco">
                Rua Voluntário Adriano Cintra, Nº 1156
                <br>
                Vila Santos Dumont, Franca/SP
            </div>

            
        </div>


        <div class="confirmacao">
            Por gentileza confirme sua presença até
            <strong>10/10/2026</strong>
        </div>

        <div class="botao" onclick="window.location.href='confirmar_presenca.html'">Confirmar Presença</div>

    </div>

</body>

<script>
    function atualizarContador() {

        const dataCasamento = new Date("2026-12-05T19:00:00");

        const agora = new Date();
        const diferenca = dataCasamento - agora;

        if (diferenca <= 0) {
            document.getElementById("contador").innerText = "O grande dia chegou! 💍✨";
            return;
        }

        const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
        const horas = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));
        const segundos = Math.floor((diferenca % (1000 * 60)) / 1000);

        document.getElementById("contador").innerText =
            `Faltam ${dias} dias, ${horas} hrs, ${minutos} min e ${segundos} seg`;
    }

    setInterval(atualizarContador, 1000);
    atualizarContador();
</script>


</html>
